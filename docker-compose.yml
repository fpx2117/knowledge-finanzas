services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: know_finanzas
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d know_finanzas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
